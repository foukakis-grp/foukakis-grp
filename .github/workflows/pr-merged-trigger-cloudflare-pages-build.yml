name: pr-merged-trigger-cloudflare-pages-build

on:
  pull_request:
    types: [closed]

jobs:
  call-cloudflare-hook:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Call Cloudflare Pages deploy hook
        run: |
          curl -d "" "${{ secrets.DEPLOY_HOOK }}"
