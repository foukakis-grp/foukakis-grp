  text: Emmanouil is a bioinformatician at Karolinska Institutet specializing in translational breast-cancer genomics. His research focuses on reproducible analysis of bulk, spatial, and single-cell transcriptomics (RNA-seq and microarray) and on method development for molecular classification in breast cancer. He holds a PhD and MSc in Biomedical Engineering and a five-year Diploma in Electronic and Computer Engineering.
