- name: "Ioannis Zerdes"
  photo: Ioannis.jpg
  info: MD, PhD, Associate Professor
  email: ioannis.zerdes@ki.se
  number_educ: 0
  education1: Education 1
  education2: Education 2
  text: "Ioannis Zerdes is an Associate Professor (Docent) at Karolinska Institutet and Clinical Fellow in Medical Oncology at Karolinska University Hospital in Stockholm, Sweden. He completed his medical degree (MD) at the University of Ioannina in 2015 and PhD in breast cancer immuno-oncology at Karolinska Institutet in 2020. His research focuses on translational cancer research with a focus on breast cancer, immuno-oncology, tumor microenvironment, biomarker discovery and response-adapted treatment strategies, integrating multi-omics profiling within clinical trial and retrospective cohort settings. He has authored >50 peer-reviewed publications and has presented his work at national and international conferences. He has received competitive funding from the Swedish Cancer Society, Swedish Society of Oncology, Region Stockholm and from several foundations, among others. He is Chair of the Young Investigators Steering Committee of the EORTC Breast Cancer Group. He is also an Associate Editor of Breast Cancer Research journal and active member of ESMO, ASCO, AACR. He supervises undergraduate/master/PhD students and postdoctoral researchers and has been an invited lecturer in several oncology-focused undergraduate and postgraduate courses."
