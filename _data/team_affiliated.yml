- name: "Xingrong Liu"
  photo: Xingrong.JPG
  info: PhD - Biostatistician
  email: xingrong.liu@ki.se
  number_educ: 0
  education1: Education 1
  education2: Education 2
  text: Xingrong joined our group as a biostatistician in September 2023. He works closely with clinicians and researchers to design studies, manage data, and perform statistical analyses in breast cancer research. Xingrong also supports PhD students, postdocs, and colleagues in applying advanced statistical methods and conducting real-world evidence studies. Before joining the group, he gained research experience in genome-wide association studies of gastrointestinal disease and in registry-based perinatal epidemiology. With an educational background in computational mathematics and mathematical statistics, he earned his Ph.D. in 2017 from the Department of Medical Epidemiology and Biostatistics at Karolinska Institutet, where his doctoral thesis focused on developing and implementing statistical methods for survival analysis. Outside of research, Xingrong enjoys cooking and trying out new recipes. According to his own data, his body weight follows a predictable seasonal pattern- a winter increase followed by a carefully managed summer decrease.
