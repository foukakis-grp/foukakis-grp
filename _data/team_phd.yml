  number_educ: 0
  education1: 
  education2: 
  text: "Emilia is a first-year PhD student working in bioinformatics, where she applies multi-omics approaches to unravel the biology of breast cancer and the effect of treatment in the tumor microenvironment. She holds a degree in Biotechnological Processes Engineering from Universidad San Francisco de Quito (Ecuador). Her early work focused on regenerative medicine using mitochondria, and for her undergraduate thesis, she developed a technique to slow down breast cancer cells progression through the transfer of modified mitochondria, sparking her lasting interest in breast cancer research. Emilia later received an Erasmus Mundus scholarship for the double degree International Master in Innovative Medicine (IMIM), earning a Master’s in Translational Medical Research from Heidelberg University (Germany) and a Master’s in Medical Sciences from Uppsala University (Sweden). She joined our group in January 2024 for her master thesis work and has been part of the team ever since."
  id: 50008