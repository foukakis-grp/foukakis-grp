  text: "Evangelos is a PhD student with medical background. He studied medicine in Athens, Greece, between 2013-2019. During his PhD he developed a solid oncologic background and collaborated effectively within the multidisciplinary team. His main interests include tumour biology, oncology, and pathology. He has experience in wet lab (from tissue staining to nucleic acid extraction), in digital pathology (QuPath software, InForm software, training and application of various cell classifiers), and in dry lab (interpretation of bulk -omics results). He is also interested in teaching, as he is a mentor and teaching assistant in the doctoral course for Msc and PhD students, entitled “Basic Course in Tumor Biology and Oncology, #3112”. 
  Biggest achievement:
  Significant contribution in the development of an RNA-based signature, CDKPredX, which predicts resistance to neoadjuvant chemotherapy and sensitivity to the combination of CDK4/6 inhibitors and endocrine therapy, for ER+/HER2- breast cancer, in the context of PREDIX LumB study."
