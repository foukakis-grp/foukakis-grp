  text: Angeliki is a second-year PhD student working on biomarkers before and after neoadjuvant and adjuvant treatment in breast cancer. She applies biostatistical methods in registry-based studies and is also involved in experimental work using immunohistochemistry and digital pathology. She holds an MD degree and a medical license in Sweden (Leg. läkare). She joined the group in March 2022 as a research assistant contributing to two projects funded by the European Union’s Horizon 2020 research and innovation programme and remains an active member since then. 
