  text: Michail Sarafidis is a postdoctoral research fellow at Karolinska Institutet in the Theodoros Foukakis Group since 2023. He works as a bioinformatician and data analyst on translational breast cancer studies. His research involves transcriptomics, genomics, multi-omics integration, machine learning, and data mining. He holds a Ph.D. in Electrical and Computer Engineering with a specialization in Bioinformatics from the Biomedical Engineering Laboratory, National Technical University of Athens (NTUA), Greece. His doctoral work focused on molecular biomarker discovery in urinary bladder cancer. Before joining Karolinska Institutet, he worked as a junior researcher at the Institute of Communication and Computer Systems (ICCS), NTUA, contributing to national and international research projects. His expertise spans Bioinformatics, Health and Medical Informatics, and Health Data Science, with extensive experience in academic research, EU-funded projects, teaching, and course coordination. Michail also holds a Diploma (M.Eng.) in Electrical and Computer Engineering from NTUA, enabling him to apply engineering principles to biomedical research.
