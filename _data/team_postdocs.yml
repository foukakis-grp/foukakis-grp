  text: "Sen joined our group in February 2024 as a bioinformatics postdoctoral researcher jointly affiliated with our team and Nicola Crosetto's group at SciLifeLab. His current research focuses on applying multi-omics approaches to study clonal dynamics and treatment resistance mechanisms in breast cancer. He holds a PhD in Bioinformatics and has an academic background in Ecology. Before joining our group, Sen worked on the speciation and evolutionary genomics of mangroves, exploring how species adapt to changing environments. Sen is broadly interested in how organisms—and individual cells—respond to macro- and micro-environmental changes. He is passionate about using computational and multi-omics tools to uncover the biological stories behind complex systems."
