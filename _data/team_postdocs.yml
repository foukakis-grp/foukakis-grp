  text: Rong Deng joined the group in 2025 as a postdoc focusing on breast cancer immunology. Her research explores the immune mechanisms within the tumor microenvironment, with a particular interest in T-cell phenotyping and functional characterization using advanced flow cytometry. She obtained her PhD in China. Rong is passionate about understanding how immune regulation shapes cancer progression and how these insights can contribute to novel therapeutic strategies.
