  text: Panagiotis has been a Postdoctoral Researcher in the group since April 2025. His research primarily focuses on secondary endpoints in clinical trials, with a particular interest in the quality of life of breast cancer patients. His PhD work encompassed evidence synthesis, epidemiology and clinical data analyses, as well as in vivo research. He holds a medical degree and a master’s in cytogenetics and cytogenetic epidemiology.
