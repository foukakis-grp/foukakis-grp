  text: "Kerstin is a postdoctoral researcher in Theo Foukakis’ team, focusing on biomarker discovery and validation in clinical trials. Her research explores potential biomarkers with prognostic and predictive relevance. She is also involved in evaluating AI-based models for their prognostic and predictive value across different patient cohorts. Kerstin is a general surgeon, specializing on breast surgery, based in Vienna, Austria, and joined the group in May 2025. She holds a medical degree and a PhD-equivalent degree in Applied Medical Sciences. Photo copyright: Medical University Vienna/Matern"
