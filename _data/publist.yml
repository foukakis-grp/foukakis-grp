- title: Chemoresistance Evolution in Triple-Negative Breast Cancer Delineated by Single-Cell Sequencing
  image: cell_2018.jpg
  description: In this study of 20 patients with triple-negative breast cancer undergoing neoadjuvant chemotherapy, single-cell and bulk sequencing revealed that treatment resistance arose from adaptive selection of pre-existing resistant clones rather than new genomic mutations. While resistant genotypes were already present before therapy, chemotherapy induced transcriptional reprogramming that shaped resistant cellular states.
  authors: C. Kim, R. Gao, E. Sei, R. Brandt, J. Hartman, T. Hatschek, N. Crosetto, T. Foukakis, N. E. Navin
  link:
    url: https://doi.org/10.1016/j.cell.2018.03.041
    display: Cell (2018)
  highlight: 1
  long: 1

- title: Neoadjuvant Trastuzumab, Pertuzumab, and Docetaxel vs Trastuzumab Emtansine in Patients With ERBB2-Positive Breast Cancer
  image: jama_onc_2021.png
  description: In the randomized phase 2 PREDIX HER2 trial of 202 patients with ERBB2-positive breast cancer, neoadjuvant trastuzumab emtansine (T-DM1) achieved a pathologic complete response rate similar to standard docetaxel, trastuzumab, and pertuzumab (43.9% vs 45.5%; not statistically significant). These findings suggest that, in selected patients, neoadjuvant therapy may be safely de-escalated to T-DM1 monotherapy, with comparable efficacy to standard combination treatment.
  authors: T. Hatschek, T. Foukakis, J. Bjöhle, T. Lekberg, H. Fredholm, E. Elinder, A. Bosch, G. Pekar, H. Lindman, A. Schiza, Z. Einbeigi, J. Adra, A. Andersson, L. Carlsson, A. C. Dreifaldt, E. Isaksson‑Friman, S. Agartz, E. Azavedo, P. Grybäck, M. Hellström, H. Johansson, C. Maes, I. Zerdes, J. Hartman, Y. Brandberg, J. Bergh
  link:
    url: http://doi.org/10.1001/jamaoncol.2021.1932
    display: JAMA Oncology (2021)
  highlight: 1
