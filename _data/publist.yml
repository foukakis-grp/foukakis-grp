- title: "Survival Outcomes, Digital TILs, and On-treatment PET/CT During Neoadjuvant Therapy for HER2-positive Breast Cancer: Results from the Randomized PREDIX HER2 Trial"
  image: ccr2023_29_3.png
  description: PREDIX HER2 showed similar long-term outcomes for neoadjuvant T‑DM1 and THP in HER2‑positive BC. Higher SUVmax on PET/CT after two cycles predicted lower pCR and worse EFS, and baseline TILs/DTILs added independent prognostic value—supporting combined assessment to identify poor responders early.
  authors: A. Matikas, H. Johansson, P. Grybäck, J. Bjöhle, B. Acs, C. Boyaci, T. Lekberg, H. Fredholm, E. Elinder, S. Margolin, E. Isaksson-Friman, A. Bosch, H. Lindman, J. Adra, A. Andersson, S. Agartz, M. Hellström, I. Zerdes, J. Hartman, J. Bergh, T. Hatschek, T. Foukakis
  link:
    url: https://doi.org/10.1158/1078-0432.CCR-22-2829
