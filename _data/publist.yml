- title: PANTHER Trial Publications
  image: jama_2016.png
  description: At the 5-year analysis, tailored dose-dense adjuvant chemotherapy did not significantly improve breast cancer recurrence–free survival compared with standard 3-weekly treatment, despite modest improvement in event-free survival and increased toxicity. However, after 10.3 years of follow-up in the PANTHER trial, dose-dense chemotherapy significantly improved recurrence-free, event-free, and distant disease–free survival—marking the first demonstration of benefit over an optimal control regimen that included docetaxel administered every 3 weeks—although overall survival remained not statistically significant.
  authors: T. Foukakis, A. Matikas, et al., SweBCG, GBG, ABCSG Consortia
  link:
    url: http://doi.org/10.1001/jama.2016.15865
    display: JAMA (2016)
