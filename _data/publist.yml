- title: "Machine learning-based spatial characterization of tumor-immune microenvironment in the EORTC 10994/BIG 1-00 early breast cancer trial"
  image: eortc_zerdes.webp
  description: ML-based digital TIL quantification and multiplex immunofluorescence on pretreatment biopsies show that higher dTILs, total CD4+ and intra-tumoral CD8+ cells—and increased immune–tumor colocalization, especially in triple-negative and TP53‑mutant tumors—predict pathological complete response in early breast cancer.
  authors: I. Zerdes, A. Matikas, A. Mezheyeuski, G. Manikis, B. Acs, H. Johansson, C. Boyaci, C. Boman, C. Poncet, M. Ignatiadis, Y. Bai, D. L. Rimm, D. Cameron, H. Bonnefoi, J. Bergh, G. MacGrogan, T. Foukakis
  link:
