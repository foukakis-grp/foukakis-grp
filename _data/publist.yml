- title: Longitudinal molecular profiling elucidates immunometabolism dynamics in breast cancer.
  image: natcoms_2024.png
  description: This study longitudinally profiles immunometabolic changes in breast tumors before, during, and after neoadjuvant chemotherapy using multi-omics approaches, revealing dynamic interactions between tumor metabolism and immune states. Distinct metabolic programs in tumor and immune cells were associated with treatment response, supporting tumor metabolism as a target for immunomodulation.
  authors: K. Wang, I. Zerdes, H. J. Johansson, D. Sarhan, Y. Sun, D. C. Kanellis, E. G. Sifakis, A. Mezheyeuski, X. Liu, N. Loman, I. Hedenfalk, J. Bergh, J. Bartek, T. Hatschek, J. Lehtiö, A. Matikas, T. Foukakis
  link:
    url: https://doi.org/10.1038/s41467-024-47932-y
    display: Nature Communications (2024)
