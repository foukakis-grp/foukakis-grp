- date: 7 April 2026
  headline: Rong and Konstantinos have been awarded a Blue Sky Grant! Congratulations to Dr. Rong Deng and Dr. Konstantinos Georgiadis, postdocs in our group, for being awarded a Blue Sky Grant each. This grant funds projects led by pairs of postdoctoral researchers and/or PhD students from different research groups within the Oncology-Pathology department at KI, for which they will receive SEK 300,000. Read more [here](https://news.ki.se/recipients-of-onkpats-2026-blue-sky-grant-announced).

- date: 17 March 2026
  headline: Ioannis and Andri receive research funding from Cancerfonden! We are happy and proud to announce that Assoc. Prof. Ioannis Zerdes has received the prestigious Junior Clinical Investigator Award from the Swedish Cancer Society (Cancerfonden). With this, he has been awarded six years of dedicated research time, besides his clinical work. Dr. Andri Papakonstantinou has also received funding from Cancerfonden in the form of Research Months, which includes 3 months of dedicated research time for three years. You can read more [here](https://www.cancerfonden.se/nyhet/nya-forskartjanster-med-rekordsatsning-pa-unga-forskare).

- date: 23 January 2026
  headline: Kang finishes his PhD! Huge congratulations to Dr. Wang, who has done an amazing job these past years and defended his doctoral thesis on January 23, 2026. His oponent was renowned breast cancer researcher Professor Charles M. Perou from the University of North Carolina at Chapel Hill (USA). His dissertation was titled 'Delineating the molecular landscape of breast cancer and response to neoadjuvant systemic treatment', you can read more [here](https://news.ki.se/new-thesis-on-how-breast-cancer-adapts-to-treatment). ![image](/images/newspic/kang_defense.jpeg){:class="img-responsive"}

- date: 24 October 2025
  headline: Congrats to Caroline Boman for successfully defending her PhD thesis today 🎓! Her dissertation is titled 'Breast cancer biomarkers, dynamics during treatment and metastatic progression'. You can read it [here](https://openarchive.ki.se/articles/thesis/Breast_cancer_biomarkers_dynamics_during_treatment_and_metastatic_progression/28623197?file=58128625). ![image](/images/newspic/caroline_defense.jpeg){:class="img-responsive"}

- date: 16 September 2025
  headline: Getting the right breast cancer therapy to the right patient is an interview done by KI to Theodoros Foukakis approaching the ceremony for newly appointed professors on October 9, 2025. Theo was appointed Professor of Oncology on April 2, 2025. The installation ceremony took place in Aula Medica, where 22 new professors at KI were inaugurated. Congrats! 🎉 Read more (and watch a video) [here](https://news.ki.se/getting-the-right-breast-cancer-therapy-to-the-right-patient). ![image](/images/newspic/Theodoros_Foukakis-15-KLAR_custom20250904100628.jpg){:class="img-responsive"}

- date: 12 September 2025
  headline: Congrats to Alexios  Matikas, who was been awarded with The Swedish Society of Medicine's 2025 recognisement for the best project proposal! The project he presented involves our clinical trial ARIADNE, and it is titled 'Integrated multi-omics for prediction of response to antibody-drug conjugates'. Read more (in Swedish) [here](https://www.mynewsdesk.com/se/svenska-laekaresaellskapet/pressreleases/studie-om-hur-effekter-av-cancerlaekemedel-kan-foerutses-beloenas-av-svenska-laekaresaellskapet-3402203). ![image](/images/newspic/Alex_news.jpg){:class="img-responsive"}

