- title: "Epidemiology"
  key: "projtheme2"
  hasimage: 1
  width: 60%
  image: epidemiology.jpg
  description: Clinical trials show how breast cancer treatments work in controlled settings. They usually include younger, healthier individuals and do not capture the diversity of patients seeking care in breast cancer clinics. Our research looks at how breast cancer develops and how treatments perform in everyday situations. Through epidemiological studies we can study a broader and more representative population than clinical trials - better reflecting the diverseness of breast cancer patients, including older patients and those with other health conditions. Using nationwide registers that link information on patients, tumors characteristics, treatments, and long-term follow-up events, we can investigate biomarker dynamics during treatments, treatment adherence and usage, and identify factors that impact on or lead to better outcomes in a variety of scenarios. Real-world data (RWD) and evidence (RWE) support improvements in clinical care, guide future research, and help in the design of new clinical trials.
  contact: Louise Eriksson (louise.eriksson@ki.se)
  members: Louise Eriksson, Xingrong Liu, Andri Papankonstantinou, Alexios Matikas
