- title: "Translational Biomarker Research"
  key: "projtheme4"
  hasimage: 1
  width: 60%
  image: biomarker.jpg
  description: | 
    Breast cancer is a biologically and clinically heterogeneous disease, and patients with similar clinicopathological characteristics may experience markedly different responses to therapy and clinical outcomes. Our translational biomarker research aims to identify prognostic and predictive biomarkers that improve patient stratification and guide treatment selection across breast cancer subtypes and treatment settings. 
    We combine comprehensive molecular profiling of tumour tissue and blood samples with detailed clinical data from prospective clinical trials and well-annotated patient cohorts. We use multi-omics approaches – including RNA sequencing, DNA sequencing, proteomics, single-cell and single-nucleus RNA sequencing, spatial transcriptomics, and digital pathology – to investigate tumour-intrinsic biology as well as the tumour microenvironment to better understand mechanisms of treatment response, resistance, and disease progression. 
    A central component of our work is the integration of translational molecular analyses within prospective neoadjuvant clinical trials, enabling direct links between tumour biology, treatment exposure, and clinical outcomes. By integrating multi-omics data with detailed clinical annotation and applying advanced computational and statistical approaches for biomarker development and validation, we aim to identify biologically meaningful tumour subgroups and develop biomarkers that inform treatment escalation, de-escalation, and patient selection for specific therapies. 
    Ultimately, our goal is to advance precision medicine in breast cancer by improving patient selection for therapy and enabling more individualized treatment strategies that maximize benefit while minimizing unnecessary toxicity.
  contact: Emmanouil Sifakis (emmanouil.sifakis@ki.se)
  members: Emmanouil Sifakis, Kang Wang, Michail Sarafidis, Sen Li, Emilia Morales
