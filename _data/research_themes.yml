
- title: "Clinical Trials"
  key: "projtheme1"
  hasimage: 1
  width: 60%
  image: clinical.png
  description: Clinical studies are essential for improving breast cancer care by translating discoveries into evidence-based treatments. In this section, we present our portfolio of investigator-led and collaborative studies that evaluate new therapies, optimize existing regimens, and refine treatment intensity to maximize benefit while minimizing toxicity. Across these trials, we integrate robust clinical endpoints with translational analyses, linking patient outcomes to tumor biology, biomarkers, and treatment response to accelerate precision medicine for people with breast cancer.
