- title: "Translational Biomarker Research"
  key: "projtheme4"
  hasimage: 1
  width: 60%
  image: biomarker.jpg
  description: Breast cancer tumors are highly heterogeneous, and our translational biomarker research aims to define clinically actionable prognostic and predictive biomarkers that improve patient stratification and guide treatment selection. We integrate molecular profiling with detailed clinical annotation across subtypes and treatment contexts, using multi-omics approaches—including bulk RNA-seq and DNA-seq, single-cell and single-nucleus RNA-seq, and spatial transcriptomics to characterize tumor cells and the surrounding microenvironment, understand mechanisms of progression and resistance, and ultimately refine precision medicine by matching each patient to the therapy most likely to benefit them while avoiding unnecessary toxicity.
  contact: Emmanouil Sifakis (emmanouil.sifakis@ki.se)
  members: Emmanouil Sifakis, Kang Wang, Michail Sarafidis, Sen Li, Emilia Morales
  projects: 
  tag: 10004
